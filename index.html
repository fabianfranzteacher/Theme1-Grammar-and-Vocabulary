<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theme 1 – On the move · Grammar &amp; Vocabulary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#CFE8F0; --bg2:#EEF7F2; --ink:#1D2B33; --muted:#4F5F69; --card:#fff; --line:#D5DEE3;
  --red:#C8102E; --red2:#8E0B20; --green:#00843D; --green2:#005C2A; --gold:#FFC72C; --slate:#3B4A54;
  --cS:#2F6FD6; --cA:#C8102E; --cV:#00843D; --cN:#E07A00; --cQ:#7B3FB5; --cC:#0E8C8C;
  --ok:#00843D; --okbg:#DDF3E6; --no:#C8102E; --nobg:#FCE3E6;
  --shadow:0 4px 0 rgba(29,43,51,.16); --r:18px;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{font-size:18px}
html.big{font-size:23px}
body{margin:0;color:var(--ink);background:linear-gradient(180deg,var(--bg1),var(--bg2)) fixed;font:1rem/1.55 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
h1,h2,h3{font-family:"Lilita One","Atkinson Hyperlegible",system-ui,sans-serif;font-weight:400;line-height:1.15;margin:0 0 .4em}
h1{font-size:clamp(2rem,5vw,3.2rem)} h2{font-size:1.7rem} h3{font-size:1.25rem}
p{margin:0 0 .8em}
button{font:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.wrap{position:relative;z-index:2;max-width:1000px;margin:0 auto;padding:14px 16px 140px}
.hills{position:fixed;left:0;right:0;bottom:0;z-index:0;pointer-events:none}
.hills svg{display:block;width:100%;height:auto}
.card{background:var(--card);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow);margin-bottom:18px}
.muted{color:var(--muted)} .small{font-size:.88rem}

/* bars & buttons */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar .grow{flex:1}
.ibtn{min-height:48px;min-width:48px;border-radius:14px;border:0;background:#fff;color:var(--ink);box-shadow:var(--shadow);font-weight:700;padding:0 14px;display:inline-flex;align-items:center;gap:6px}
.ibtn.on{background:var(--slate);color:#fff}
.btn{border:0;border-radius:14px;padding:12px 22px;min-height:52px;font-weight:700;background:var(--red);color:#fff;box-shadow:0 4px 0 var(--red2)}
.btn.green{background:var(--green);box-shadow:0 4px 0 var(--green2)}
.btn.alt{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn:active,.ibtn:active{transform:translateY(3px)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:14px}

/* home */
.hero{display:flex;align-items:center;gap:18px;margin:4px 0 18px}
.hero svg{flex:0 0 auto;width:clamp(86px,13vw,140px);height:auto}
.lessons{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.lcard{border:0;text-align:left;background:#fff;border-radius:20px;padding:18px 20px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:flex-start;color:var(--ink)}
.lcard .num{flex:0 0 auto;font-family:"Lilita One",sans-serif;font-size:1.4rem;color:#fff;background:var(--red);border-radius:12px;padding:6px 10px;min-width:62px;text-align:center}
.lcard:nth-child(even) .num{background:var(--green)}
.lcard b{display:block;font-size:1.12rem}
.lcard small{color:var(--muted)}
.lcard .r{font-size:.75rem;background:var(--gold);color:#3a2a00;border-radius:6px;padding:1px 6px;margin-left:6px;font-weight:700;vertical-align:middle}
.legend{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* colour blocks */
.blk{display:inline-flex;flex-direction:column;align-items:center;vertical-align:top;margin:0 2px 4px;line-height:1.2}
.blk > span:first-child{border-radius:10px;padding:5px 9px;color:#fff;font-weight:700}
.blk small{font-size:.62rem;font-weight:700;margin-top:3px;letter-spacing:.02em;white-space:nowrap}
.blk.S > span:first-child{background:var(--cS)} .blk.S small{color:var(--cS)}
.blk.A > span:first-child{background:var(--cA)} .blk.A small{color:var(--cA)}
.blk.V > span:first-child{background:var(--cV)} .blk.V small{color:var(--cV)}
.blk.N > span:first-child{background:var(--cN)} .blk.N small{color:#A05600}
.blk.Q > span:first-child{background:var(--cQ)} .blk.Q small{color:var(--cQ)}
.blk.C > span:first-child{background:var(--cC)} .blk.C small{color:var(--cC)}
.blk.moved > span:first-child{box-shadow:0 0 0 3px var(--gold)}
.blk.nolabel small{visibility:hidden}
.c-S{color:var(--cS);font-weight:700} .c-A{color:var(--cA);font-weight:700} .c-V{color:var(--cV);font-weight:700} .c-N{color:#B35F00;font-weight:700} .c-Q{color:var(--cQ);font-weight:700} .c-C{color:var(--cC);font-weight:700}
.plain{display:inline-block;padding:5px 2px;vertical-align:top;margin-bottom:4px}

/* pattern table */
.ptable{display:grid;gap:10px}
.prow{display:grid;grid-template-columns:54px 1fr;gap:10px;align-items:start;background:#F7FAF8;border-radius:14px;padding:10px 12px}
.badge{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:12px;font-family:"Lilita One",sans-serif;font-size:1.5rem;color:#fff}
.badge.k-plus{background:var(--green)} .badge.k-minus{background:#E07A00} .badge.k-q{background:var(--cQ)} .badge.k-wh{background:var(--cQ);font-size:.95rem} .badge.k-past{background:var(--slate);font-size:.8rem}
.prow .sub{font-size:.9rem;color:var(--muted);margin-top:2px}

/* sentence machine */
.machine{background:#10334A;color:#fff;border-radius:18px;padding:18px;margin:14px 0}
.machine h3{color:var(--gold)}
.mline{min-height:92px;display:flex;flex-wrap:wrap;align-items:flex-start;gap:4px;padding:10px 0;font-size:1.25rem}
.mline .plain{color:#fff}
.mline .blk small{color:#fff !important;opacity:.85}
.mbtns{display:flex;gap:10px;flex-wrap:wrap}
.mbtns button{border:0;border-radius:12px;min-height:52px;min-width:64px;font-size:1.3rem;font-weight:700;background:#fff;color:var(--ink)}
.mbtns button.on{background:var(--gold)}
.mnote{min-height:2.6em;margin:8px 0 0;color:#E9F3F7}

.info{border-radius:14px;padding:12px 16px;margin:12px 0}
.info.form{background:#FFF6D6;border-left:6px solid var(--gold)}
.info.move{background:#EEF3FB;border-left:6px solid var(--cS)}
.info.watch{background:#FCE3E6;border-left:6px solid var(--red)}
.info.sig{background:#E7F4EC;border-left:6px solid var(--green)}
.tl{margin:14px 0;background:#F7FAF8;border-radius:14px;padding:14px}
.conn{display:flex;flex-wrap:wrap;gap:8px}
.conn span{background:#E3F4F4;border-radius:10px;padding:4px 10px}
.de-toggle{float:right}

/* lesson nav */
.steps{display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:5;padding:10px 0;background:linear-gradient(var(--bg1) 70%,transparent)}
.steps a{text-decoration:none;color:var(--ink);background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;box-shadow:var(--shadow)}
.exhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.exhead .tag{font-family:"Lilita One",sans-serif;background:var(--red);color:#fff;border-radius:10px;padding:2px 10px}

/* exercises */
.item{display:grid;grid-template-columns:48px 1fr 34px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .badge{width:38px;height:38px;font-size:1.3rem}
.item .res{font-size:1.4rem;text-align:center}
.sent{font-size:1.15rem;line-height:2.1}
.choice{display:inline-flex;gap:4px;vertical-align:middle;margin:0 3px}
.choice button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:2px 10px;font-weight:700;color:var(--ink);min-height:40px}
.choice button.sel{border-color:var(--cS);background:#E8F0FC}
.choice button.right{border-color:var(--ok);background:var(--okbg)}
.choice button.wrong{border-color:var(--no);background:var(--nobg)}
.gap{font:inherit;font-size:1.05rem;width:9.5em;max-width:60vw;padding:4px 8px;border:2px solid var(--line);border-bottom:3px solid var(--cS);border-radius:8px;margin:0 3px}
.gap.right{border-color:var(--ok);background:var(--okbg)} .gap.wrong{border-color:var(--no);background:var(--nobg)}
.hint{color:var(--muted);font-size:.92rem}
.sol{display:block;font-size:.95rem;color:var(--green2);font-weight:700;line-height:1.4}
textarea{width:100%;min-height:150px;font:inherit;font-size:1.1rem;padding:12px;border:2px solid var(--line);border-radius:12px}
.model{background:#F7FAF8;border-radius:14px;padding:12px 16px;margin-top:12px}
.model li{margin-bottom:4px}
.chk{display:flex;gap:10px;align-items:flex-start;margin:6px 0}
.chk input{width:24px;height:24px;flex:0 0 24px;accent-color:var(--green)}
.score{font-weight:700;margin-left:auto}

/* vocabulary */
.voc{border:0;background:none;padding:0;font:inherit;color:inherit;border-bottom:2px dotted var(--green);cursor:help}
.voc:hover,.voc.open{background:#E7F4EC;border-radius:4px}
.pop{position:absolute;z-index:50;background:var(--slate);color:#fff;border-radius:12px;padding:10px 14px;max-width:280px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:.95rem;line-height:1.35}
.pop b{display:block;color:var(--gold)}

@media (max-width:640px){
  .item{grid-template-columns:40px 1fr 26px}
  .prow{grid-template-columns:44px 1fr}
  .mline{font-size:1.05rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.steps,.bar,.hills,.row{display:none}.card{box-shadow:none;border:1px solid #ccc}}

/* ===== start screen & vocabulary ===== */
.big2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.tile{border:0;border-radius:24px;padding:26px 24px;text-align:left;color:#fff;background:var(--red);box-shadow:0 6px 0 var(--red2);display:flex;flex-direction:column;gap:6px;min-height:190px}
.tile.green{background:var(--green);box-shadow:0 6px 0 var(--green2)}
.tile .ico{font-size:2.6rem;line-height:1}
.tile b{font-family:"Lilita One",sans-serif;font-weight:400;font-size:2rem}
.tile small{font-size:1rem;opacity:.95}
.tile:active{transform:translateY(4px)}
.btn.sm{min-height:44px;padding:8px 16px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:10px}
.chip{border:3px solid var(--line);background:#fff;border-radius:14px;padding:8px 6px;color:var(--ink);display:flex;flex-direction:column;align-items:center;min-height:64px}
.chip b{font-family:"Lilita One",sans-serif;font-weight:400;font-size:1.35rem;line-height:1.1}
.chip small{font-size:.72rem;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--green);background:var(--okbg)}
.chip[aria-pressed="true"]::after{content:"✓";position:absolute;margin:-14px 0 0 54px;color:var(--green);font-weight:700}
.chip{position:relative}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.mode{border:3px solid var(--line);background:#F7FAF8;border-radius:18px;padding:16px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:4px}
.mode:hover{border-color:var(--green)}
.mode .ico{font-size:2rem;line-height:1}
.mode b{font-size:1.2rem}
.mode small{color:var(--muted)}
.warn{background:var(--nobg);color:var(--red2);border-radius:12px;padding:10px 14px;margin:12px 0 0;font-weight:700}
.prog{height:14px;background:#fff;border-radius:99px;overflow:hidden;box-shadow:inset 0 0 0 2px var(--line)}
.prog div{height:100%;background:var(--green);width:0;transition:width .3s}
.center{justify-content:center}
.fc{display:block;width:100%;max-width:620px;margin:10px auto 0;height:300px;border:0;background:none;padding:0;perspective:1200px;color:var(--ink)}
.fc .in{display:block;position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;background:#fff;box-shadow:0 6px 0 rgba(29,43,51,.16);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;gap:10px}
.fc .back{transform:rotateY(180deg);background:#FFF6D6}
.fc .face b{font-size:clamp(1.6rem,4.5vw,2.4rem);line-height:1.2}
.fc .face small{position:absolute;top:12px;left:16px;background:var(--slate);color:#fff;border-radius:8px;padding:1px 8px;font-weight:700}
.fc .face em{color:var(--muted);font-style:normal;font-size:.95rem}
.done{text-align:center}
.bank{display:flex;flex-wrap:wrap;gap:8px;background:#FFF6D6;border-radius:14px;padding:12px;margin:12px 0}
.bank span{background:#fff;border-radius:10px;padding:4px 12px;font-weight:700;box-shadow:0 2px 0 var(--line)}
.gap.wide{width:12em}
.badge.k-num{background:var(--slate);font-size:1.1rem}
mark{background:#FFE07A;color:var(--ink);border-radius:5px;padding:0 4px;font-weight:700;box-shadow:0 2px 0 #E0B000}
.tr .de{font-size:1.2rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tr .de .badge{width:36px;height:36px}
.tin{width:100%;font:inherit;font-size:1.1rem;padding:10px 12px;border:2px solid var(--line);border-bottom:3px solid var(--cS);border-radius:10px}
.tin.right{border-color:var(--ok);background:var(--okbg)} .tin.wrong{border-color:var(--no);background:var(--nobg)}
.fbk p{margin:10px 0 0}
.okmsg{color:var(--green2);font-weight:700} .nomsg{color:var(--red2);font-weight:700}
.seg{display:inline-flex;flex-wrap:wrap;gap:0;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:12px}
.seg button{border:0;background:#fff;padding:10px 18px;min-height:48px;font-weight:700;color:var(--ink);border-right:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--green);color:#fff}
.ivt{display:grid;gap:0}
.ivh,.ivr{display:grid;grid-template-columns:minmax(150px,1.2fr) minmax(150px,1fr) 34px;gap:10px;align-items:center}
.ivr.three,.ivh.three{grid-template-columns:minmax(150px,1.1fr) minmax(130px,1fr) minmax(130px,1fr) 34px}
.ivh{font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding-bottom:4px;border-bottom:2px solid var(--line)}
.ivr{padding:9px 0;border-bottom:1px solid var(--line)}
.ivr small{display:block;color:var(--muted);font-size:.85rem}
.ivr .res{font-size:1.3rem;text-align:center}
.ivr .sol{grid-column:1/-1;margin-top:-4px}
.ivf{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.ivf .gap{width:7.5em;margin:0}
.ivf .gap::placeholder{color:#9AA7AE;font-size:.85rem}
.vt{width:100%;border-collapse:collapse}
.vt th,.vt td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.vt th{font-size:.85rem;color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:12px}
.bub{position:relative;max-width:88%;background:#EEF3FB;border-radius:18px 18px 18px 4px;padding:10px 46px 10px 14px}
.bub.r{align-self:flex-end;background:#E7F4EC;border-radius:18px 18px 4px 18px}
.bub .who{display:block;font-weight:700;font-size:.85rem;color:var(--muted)}
.bub p{margin:0;font-size:1.12rem;line-height:2}
.bub .detx{font-size:.98rem;line-height:1.45;color:var(--slate);font-style:italic;border-top:1px dashed var(--line);margin-top:6px;padding-top:6px}
.debtn{position:absolute;top:6px;right:6px;width:36px;height:36px;border:0;border-radius:10px;background:#fff;box-shadow:0 2px 0 var(--line);font-size:1.05rem;padding:0}
.debtn[aria-pressed="true"]{background:var(--gold)}
.pgap{font:inherit;font-size:1rem;min-width:7em;min-height:38px;border:2px dashed var(--cS);background:#fff;border-radius:10px;padding:2px 10px;color:var(--ink);line-height:1.4;vertical-align:middle;text-align:left}
.pgap.act{border-style:solid;box-shadow:0 0 0 3px var(--gold)}
.pgap.filled{border-style:solid;background:#E8F0FC;font-weight:700}
.pgap.right{border-color:var(--ok);background:var(--okbg)} .pgap.wrong{border-color:var(--no);background:var(--nobg)}
.pbank{position:sticky;bottom:0;z-index:6;display:flex;flex-wrap:wrap;gap:8px;background:#FFF6D6;border-radius:16px;padding:12px;box-shadow:0 -4px 16px rgba(0,0,0,.12);margin-top:6px}
.ph{border:0;background:#fff;border-radius:12px;padding:8px 12px;font-weight:700;color:var(--ink);box-shadow:0 3px 0 var(--line);min-height:44px;text-align:left}
.ph:disabled{opacity:.3;cursor:default;box-shadow:none}
@media (max-width:640px){
  .ivh{display:none}
  .ivr,.ivr.three{grid-template-columns:1fr 30px}
  .ivr > span:first-child{grid-column:1/-1}
  .ivr .ivf{grid-column:1}
  .ivr .res{grid-column:2;grid-row:2}
  .bub{max-width:100%}
  .fc{height:240px}
  .pbank{max-height:38vh;overflow:auto;padding:8px;gap:6px}
  .ph{font-size:.9rem;min-height:40px;padding:6px 10px}
  .seg{display:flex}
  .seg button{flex:1;padding:10px 8px}
}

</style>
</head>

const LABEL = { S:"subject", A:"helping verb", V:"verb", N:"not", Q:"question word", C:"connective" };
const KIND = { "+":["k-plus","+","statement"], "-":["k-minus","–","negative"], "?":["k-q","?","question"], "wh":["k-wh","wh-?","question with a question word"], "past":["k-past","past","compare"] };

// ---------- markup ----------
// vocab {text|key}
const vocab = s => s.replace(/\{([^|}]+)\|([^}]+)\}/g, (m, t, k) => WORDS[k] ? `<button class="voc" data-k="${esc(k)}">${t}</button>` : t);
// colour blocks [X text]
function blocks(s, opts = {}){
  const parts = []; const re = /\[([SAVNQC]) ([^\]]+)\]/g; let last = 0, m;
  while((m = re.exec(s))){ if(m.index > last) parts.push({ t:"p", x:s.slice(last, m.index) }); parts.push({ t:m[1], x:m[2] }); last = re.lastIndex; }
  if(last < s.length) parts.push({ t:"p", x:s.slice(last) });
  return parts;
}
function blocksHTML(s, moveAux){
  return blocks(s).map((p,i) => p.t==="p" ? `<span class="plain">${vocab(esc(p.x).replace(/\{([^|}]+)\|([^}]+)\}/g,"{$1|$2}"))}</span>`
    : `<span class="blk ${p.t} ${moveAux && p.t==="A" && i===0 ? "moved" : ""}"><span>${esc(p.x)}</span><small>${LABEL[p.t]}</small></span>`).join("");
}
const T = o => o ? (o[lang] ?? o.en) : "";

// ---------- vocabulary popover ----------
let pop = null;
function closePop(){ if(pop){ pop.remove(); pop = null; $$(".voc.open").forEach(v=>v.classList.remove("open")); } }
document.addEventListener("click", e => {
  const v = e.target.closest(".voc");
  if(!v){ if(!e.target.closest(".pop")) closePop(); return; }
  const was = v.classList.contains("open"); closePop(); if(was) return;
  const w = WORDS[v.dataset.k]; if(!w) return;
  v.classList.add("open");
  pop = document.createElement("div"); pop.className = "pop"; pop.setAttribute("role","tooltip");
  pop.innerHTML = `<b>${esc(w[0])}</b>${esc(w[1])}`;
  document.body.appendChild(pop);
  const r = v.getBoundingClientRect(), pw = pop.offsetWidth;
  pop.style.left = Math.max(8, Math.min(window.scrollX + r.left, window.scrollX + document.documentElement.clientWidth - pw - 8)) + "px";
  pop.style.top = (window.scrollY + r.bottom + 6) + "px";
});

// ---------- sentence machine (+ / – / ?) ----------
function machineHTML(L){
  const rows = ["+","-","?"].map(k => L.rows.find(r => r.k===k)).filter(Boolean);
  if(rows.length < 3) return "";
  return `<div class="machine"><h3>⚙ Sentence machine</h3><p class="small" style="margin:0;color:#CFE3EA">Tap +, – and ? and watch which blocks move.</p>
    <div class="mline" id="ml" aria-live="polite"></div>
    <div class="mbtns">${rows.map(r=>`<button data-k="${r.k}" aria-label="${KIND[r.k][2]}">${KIND[r.k][1]}</button>`).join("")}</div>
    <p class="mnote" id="mn"></p></div>`;
}
function wireMachine(L){
  const ml = $("#ml"); if(!ml) return;
  const notes = { "+":{en:"Statement: subject first.",de:"Aussage: Das Subjekt steht vorne."}, "-":{en:"Negative: not / n't is added after the helping verb.",de:"Verneinung: not / n't kommt hinter das Hilfsverb."}, "?":{en:"Question: the helping verb jumps to the front.",de:"Frage: Das Hilfsverb springt nach vorne."} };
  let cur = null;
  const show = k => {
    const r = L.rows.find(x => x.k===k);
    const parts = blocks(r.s.replace(/<[^>]+>/g,"")).filter(p => !(p.t==="p" && !p.x.trim()));
    // remember old positions (FLIP)
    const old = {}; $$("#ml [data-id]").forEach(el => old[el.dataset.id] = el.getBoundingClientRect());
    const seen = {};
    ml.innerHTML = parts.map(p => {
      const base = (p.t + ":" + p.x.toLowerCase().trim()); seen[base] = (seen[base]||0) + 1; const pid = base + "#" + seen[base];
      return p.t==="p" ? p.x.trim().split(/\s+/).map((w,j)=>`<span class="plain" data-id="p:${esc(w.toLowerCase())}#${j}">${esc(w.replace(/\{([^|}]+)\|[^}]+\}/g,"$1"))}</span>`).join("")
                       : `<span class="blk ${p.t}" data-id="${esc(pid)}"><span>${esc(p.x)}</span><small>${LABEL[p.t]}</small></span>`;
    }).join("");
    if(!matchMedia("(prefers-reduced-motion: reduce)").matches) $$("#ml [data-id]").forEach(el => {
      const o = old[el.dataset.id], n = el.getBoundingClientRect();
      if(o){ const dx = o.left-n.left, dy = o.top-n.top; if(dx||dy){ el.animate([{ transform:`translate(${dx}px,${dy}px)` },{ transform:"none" }], { duration:550, easing:"cubic-bezier(.2,.8,.2,1)" }); } }
      else if(cur) el.animate([{ opacity:0, transform:"scale(.4)" },{ opacity:1, transform:"none" }], { duration:450 });
    });
    $$(".mbtns button").forEach(b => b.classList.toggle("on", b.dataset.k===k));
    $("#mn").textContent = T(notes[k]); cur = k;
  };
  $$(".mbtns button").forEach(b => b.onclick = () => show(b.dataset.k));
  show("+");
}

function choiceHTML(q, k){
  return vocab(esc(q).replace(/\{([^|}]+)\|([^}]+)\}/g,"{$1|$2}")).replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/, (m,a,b) =>
    `<span class="choice" role="group"><button data-v="${a}">${a}</button><button data-v="${b}">${b}</button></span>`);
}
function wireEx1(L){
  const items = $$("#e1 .item");
  items.forEach(it => it.querySelectorAll(".choice button").forEach(b => b.onclick = () => {
    it.querySelectorAll(".choice button").forEach(x => x.classList.remove("sel","right","wrong")); b.classList.add("sel"); it.querySelector(".res").textContent = "";
  }));
  const mark = reveal => {
    let ok = 0;
    items.forEach((it,k) => {
      const a = L.ex1[k].a, sel = it.querySelector(".choice button.sel");
      it.querySelectorAll(".choice button").forEach(b => b.classList.remove("right","wrong"));
      if(reveal){ it.querySelector(`.choice button[data-v="${CSS.escape(a)}"]`).classList.add("right"); it.querySelector(".res").textContent = ""; if(sel && sel.dataset.v===a) ok++; return; }
      if(!sel){ it.querySelector(".res").textContent = "…"; return; }
      const right = sel.dataset.v===a; if(right) ok++;
      sel.classList.add(right ? "right" : "wrong"); it.querySelector(".res").textContent = right ? "✅" : "❌";
    });
    $("#sc1").textContent = `${ok} / ${items.length}`;
  };
  $("#c1").onclick = () => mark(false);
  $("#s1").onclick = () => mark(true);
  $("#r1").onclick = () => { items.forEach(it => { it.querySelectorAll(".choice button").forEach(b => b.classList.remove("sel","right","wrong")); it.querySelector(".res").textContent = ""; }); $("#sc1").textContent = ""; };
}

// ---------- exercise 2: fill in ----------
function gapHTML(q, k){
  let g = 0;
  const html = vocab(esc(q).replace(/\{([^|}]+)\|([^}]+)\}/g,"{$1|$2}"));
  return html.replace(/___/g, () => `<input class="gap" data-g="${g++}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Gap ${g}">`)
             .replace(/\(([^)]+)\)/g, `<span class="hint">($1)</span>`) + `<span class="sol" hidden></span>`;
}
const norm = s => String(s).replace(/[’‘`´]/g,"'").replace(/\s+/g," ").trim().replace(/[.!?]+$/,"").toLowerCase();
const expand = s => s.replace(/\bwon't\b/g,"will not").replace(/\bcan't\b/g,"cannot").replace(/n't\b/g," not").replace(/'m\b/g," am").replace(/'re\b/g," are").replace(/'ve\b/g," have").replace(/^'ve$/,"have").replace(/\s+/g," ").trim();
const same = (a, b) => norm(a)===norm(b) || expand(norm(a))===expand(norm(b));
function wireEx2(L){
  const items = $$("#e2 .item");
  items.forEach(it => it.querySelectorAll(".gap").forEach(g => g.oninput = () => { g.classList.remove("right","wrong"); it.querySelector(".res").textContent = ""; }));
  const mark = reveal => {
    let ok = 0;
    items.forEach((it,k) => {
      const ans = L.ex2[k].a, gaps = [...it.querySelectorAll(".gap")]; let all = true;
      gaps.forEach((g,j) => {
        const good = ans[j].some(a => same(g.value, a));
        if(reveal){ g.value = ans[j][0]; g.classList.remove("wrong"); g.classList.add("right"); }
        else { g.classList.toggle("right", good && !!g.value.trim()); g.classList.toggle("wrong", !good && !!g.value.trim()); if(!good) all = false; }
      });
      const sol = it.querySelector(".sol");
      if(reveal){ sol.hidden = true; it.querySelector(".res").textContent = ""; return; }
      const empty = gaps.every(g => !g.value.trim());
      if(empty){ it.querySelector(".res").textContent = "…"; sol.hidden = true; return; }
      if(all) ok++;
      it.querySelector(".res").textContent = all ? "✅" : "❌";
      sol.hidden = all; if(!all) sol.textContent = "→ " + ans.map(a => a[0]).join(" … ");
    });
    if(!reveal) $("#sc2").textContent = `${ok} / ${items.length}`;
  };
  $("#c2").onclick = () => mark(false);
  $("#s2").onclick = () => mark(true);
  $("#r2").onclick = () => { items.forEach(it => { it.querySelectorAll(".gap").forEach(g => { g.value = ""; g.classList.remove("right","wrong"); }); it.querySelector(".res").textContent = ""; it.querySelector(".sol").hidden = true; }); $("#sc2").textContent = ""; };
}

    $$("[data-h]").forEach(b => b.onclick = () => { const w = set[+b.dataset.h]; card(+b.dataset.h).querySelector(".fbk").innerHTML = `<p class="muted">💡 Use: <b>${esc(w.en)}</b></p>`; });
    $$("[data-m]").forEach(b => b.onclick = () => { const w = set[+b.dataset.m]; card(+b.dataset.m).querySelector(".fbk").innerHTML = `<div class="model"><b>Model:</b> ${esc(w.ten)}</div>`; });
    $$(".tin").forEach(i => { i.oninput = () => i.classList.remove("right","wrong"); i.onkeydown = e => { if(e.key==="Enter") i.closest(".tr").querySelector("[data-c]").click(); }; });
    $("#nx").onclick = () => { if(r < R.length-1){ r++; draw(); window.scrollTo(0,0); } else trans(); };
  };
  draw();
}

// ---------- irregular verbs ----------
const split = f => { const m = f.match(/^(\S+ \/ \S+|\S+)(.*)$/); return [m[1], m[2]]; };          // "was / were on the move" → ["was / were", " on the move"]
const okForms = v => v.split(" / ");
function irregular(){
  go("irregular", () => {});
  const R = roundsOf(IRREG, 10); let r = 0;
  const cell = (form, k, t) => { const [v, rest] = split(form); return `<span class="ivf"><input class="gap" data-k="${k}" data-t="${t}" placeholder="${t==="past"?"simple past":"participle"}" aria-label="${t==="past"?"simple past":"past participle"}" autocomplete="off" autocapitalize="off" spellcheck="false">${esc(rest)}</span>`; };
  const draw = () => {
    const set = R[r], P = IRR!=="pp", Q = IRR!=="past";
    app.innerHTML = `${bar(0,"Vocabulary")}
    <h1>🐉 Irregular verbs</h1><p class="muted">The irregular verbs from the Theme 1 word list · Round ${r+1} of ${R.length}</p>
    <section class="card">
      <p style="margin-bottom:6px"><b>What do you want to practise?</b></p>
      <div class="seg" role="group" aria-label="Forms">${[["past","Simple past"],["pp","Past participle"],["both","Both"]].map(([k,t])=>`<button data-f="${k}" aria-pressed="${IRR===k}">${t}</button>`).join("")}</div>
      <div class="ivt">
        <div class="ivh ${P&&Q?"three":""}"><span>infinitive</span>${P?"<span>simple past</span>":""}${Q?"<span>past participle</span>":""}<span></span></div>
        ${set.map((v,k)=>`<div class="ivr ${P&&Q?"three":""}" data-i="${k}"><span><b>${esc(v.inf)}</b><small>${esc(v.de)}</small></span>${P?cell(v.past,k,"past"):""}${Q?cell(v.pp,k,"pp"):""}<span class="res"></span>
          <span class="sol" hidden></span></div>`).join("")}
      </div>
      <div class="row"><button class="btn green" id="ci">✓ Check</button><button class="btn alt" id="si">👁 Show solutions</button><button class="btn alt" id="ri">↺ Reset</button><span class="score" id="sci"></span></div>
    </section>
    <div class="row" style="justify-content:space-between"><button class="btn alt" id="tab">📋 Show all forms</button>${r < R.length-1 ? `<button class="btn" id="nx">Next round →</button>` : `<button class="btn" id="nx">↺ New mix</button>`}</div>
    <div id="tbl"></div>`;
    wireBar(vocabHome);
    $$("[data-f]").forEach(b => b.onclick = () => { IRR = b.dataset.f; store("t1-irr", IRR); draw(); });
    const inputs = $$(".ivt .gap");
    inputs.forEach(g => g.oninput = () => { g.classList.remove("right","wrong"); g.closest(".ivr").querySelector(".res").textContent = ""; });
    const mark = reveal => {
      let ok = 0;
      $$(".ivr").forEach(row => {
        const v = set[+row.dataset.i], gs = [...row.querySelectorAll(".gap")]; let all = true, any = false;
        gs.forEach(g => {
          const forms = okForms(split(v[g.dataset.t])[0]);
          if(reveal){ g.value = forms.join(" / "); g.classList.remove("wrong"); g.classList.add("right"); return; }
          const val = norm(g.value).replace(/\s*\/\s*/g," / ");
          const good = !!val && (forms.some(f => same(val, f)) || val===forms.join(" / "));
          if(val) any = true;
          g.classList.toggle("right", good); g.classList.toggle("wrong", !!val && !good); if(!good) all = false;
        });
        const res = row.querySelector(".res"), sol = row.querySelector(".sol");
        if(reveal){ res.textContent = ""; sol.hidden = true; return; }
        if(!any){ res.textContent = "…"; sol.hidden = true; return; }
        if(all) ok++;
        res.textContent = all ? "✅" : "❌";
        sol.hidden = all; sol.textContent = "→ " + gs.map(g => v[g.dataset.t]).join(" – ");
      });
      if(!reveal) $("#sci").textContent = `${ok} / ${set.length}`;
    };
    $("#ci").onclick = () => mark(false); $("#si").onclick = () => mark(true);
    $("#ri").onclick = () => { inputs.forEach(g => { g.value = ""; g.classList.remove("right","wrong"); }); $$(".ivr .res").forEach(x => x.textContent = ""); $$(".ivr .sol").forEach(x => x.hidden = true); $("#sci").textContent = ""; };
    $("#tab").onclick = () => { const t = $("#tbl"); if(t.innerHTML){ t.innerHTML = ""; return; }
      t.innerHTML = `<section class="card"><h3>All irregular verbs in Theme 1</h3><table class="vt"><thead><tr><th>infinitive</th><th>simple past</th><th>past participle</th><th>German</th></tr></thead>
      <tbody>${IRREG.map(v=>`<tr><td>${esc(v.inf)}</td><td>${esc(v.past)}</td><td>${esc(v.pp)}</td><td>${esc(v.de)}</td></tr>`).join("")}</tbody></table></section>`;
      t.scrollIntoView({ behavior:"smooth" }); };
    $("#nx").onclick = () => { if(r < R.length-1){ r++; draw(); window.scrollTo(0,0); } else irregular(); };
  };
  draw();
}

// ---------- Say it in English ----------
function sayList(){
  go("say", () => {});
  app.innerHTML = `${bar(0,"Vocabulary")}
  <h1>💬 Say it in English</h1><p class="muted">Complete the dialogues with the phrases from p. 226. One phrase in each box does not fit.</p>
  <div class="lessons">${DIALOGUES.map((d,i)=>`<button class="lcard" data-d="${i}"><span class="num">${i+1}</span><span><b>${esc(d.t)}</b><small>${esc(d.f)}</small></span></button>`).join("")}</div>`;
  wireBar(vocabHome);
  $$("[data-d]").forEach(b => b.onclick = () => dialogue(+b.dataset.d));
}
function dialogue(i){
  go("say-" + (i+1), () => {});
  const D = DIALOGUES[i], gapsL = [];
  const lines = D.l.map((l,li) => {
    const html = esc(l[1]).replace(/\{\{(.+?)\}\}/g, (m, p) => { gapsL.push(p); return `<button class="pgap" data-g="${gapsL.length-1}" aria-label="gap ${gapsL.length}">&nbsp;</button>`; });
    return `<div class="bub ${["Cerys","Megan","Ms Jones"].includes(l[0])?"r":""}"><span class="who">${esc(l[0])}</span><p>${html}</p>
      <button class="debtn" data-de="${li}" aria-pressed="false" title="German translation">🇩🇪</button><p class="detx" hidden>${esc(l[2])}</p></div>`;
  }).join("");
  const bank = shuffle([...gapsL.map((p,k)=>({p,k})), { p:D.x, k:-1 }]);
  app.innerHTML = `${bar(0,"All dialogues")}
  <h1>💬 ${i+1} · ${esc(D.t)}</h1><p class="muted">${esc(D.f)}</p>
  <section class="card">
    <p class="small muted" style="margin-bottom:6px">Tap a gap, then tap a phrase. Tap 🇩🇪 if you need help with a line.</p>
    <div class="row" style="margin:0 0 10px"><button class="ibtn" id="alld" aria-pressed="false">🇩🇪 Show all German</button></div>
    <div class="chat">${lines}</div>
  </section>
  <div class="pbank" id="pb">${bank.map((b,j)=>`<button class="ph" data-j="${j}">${esc(b.p)}</button>`).join("")}</div>
  <div class="row"><button class="btn green" id="cd">✓ Check</button><button class="btn alt" id="sd">👁 Show solutions</button><button class="btn alt" id="rd">↺ Reset</button><span class="score" id="scd"></span></div>
  <div class="row" style="justify-content:space-between">${i>0?`<button class="btn alt" id="pv">← ${esc(DIALOGUES[i-1].t)}</button>`:"<span></span>"}${i<DIALOGUES.length-1?`<button class="btn" id="nd">${esc(DIALOGUES[i+1].t)} →</button>`:`<button class="btn" id="nd">All dialogues</button>`}</div>`;
  wireBar(sayList);
  const fill = Array(gapsL.length).fill(null);   // gap → bank index
  let act = 0;
  const render = () => {
    $$(".pgap").forEach(g => { const k = +g.dataset.g, j = fill[k];
      g.innerHTML = j===null ? "&nbsp;" : esc(bank[j].p); g.classList.toggle("filled", j!==null); g.classList.toggle("act", k===act); g.classList.remove("right","wrong"); });
    $$(".ph").forEach(b => b.disabled = fill.includes(+b.dataset.j));
    $("#scd").textContent = "";
  };
  $$(".pgap").forEach(g => g.onclick = () => { const k = +g.dataset.g; fill[k] = null; act = k; render(); });
  $$(".ph").forEach(b => b.onclick = () => {
    if(act===null) act = fill.indexOf(null);
    if(act===-1) return;
    fill[act] = +b.dataset.j; const nxt = fill.indexOf(null); act = nxt===-1 ? null : nxt; render();
  });
  $$(".debtn").forEach(b => b.onclick = () => { const t = b.nextElementSibling, on = t.hidden; t.hidden = !on; b.setAttribute("aria-pressed", on); });
  $("#alld").onclick = () => { const on = $("#alld").getAttribute("aria-pressed")!=="true"; $("#alld").setAttribute("aria-pressed", on); $("#alld").classList.toggle("on", on);
    $$(".detx").forEach(t => t.hidden = !on); $$(".debtn").forEach(b => b.setAttribute("aria-pressed", on)); };
  $("#cd").onclick = () => { let ok = 0; act = null; render();
    $$(".pgap").forEach(g => { const k = +g.dataset.g, j = fill[k]; if(j===null) return; const good = bank[j].p===gapsL[k]; if(good) ok++; g.classList.add(good?"right":"wrong"); });
    $("#scd").textContent = `${ok} / ${gapsL.length}`; };
  $("#sd").onclick = () => { gapsL.forEach((p,k) => fill[k] = bank.findIndex(b => b.k===k)); act = null; render(); $$(".pgap").forEach(g => g.classList.add("right")); };
  $("#rd").onclick = () => { fill.fill(null); act = 0; render(); };
  const pv = $("#pv"); if(pv) pv.onclick = () => dialogue(i-1);
  $("#nd").onclick = () => i<DIALOGUES.length-1 ? dialogue(i+1) : sayList();
  render();
}

// ---------- routing ----------
(() => {
  const h = location.hash.slice(1);
  const m = h.match(/^say-(\d+)$/);
  if(LESSONS.find(l => l.id===h)) lesson(h);
  else if(h==="grammar") home();
  else if(m && DIALOGUES[+m[1]-1]) dialogue(+m[1]-1);
  else if(h==="say") sayList();
  else if(h==="irregular") irregular();
  else if(h==="vocab") vocabHome();
  else if(["cards","gaps","trans"].includes(h) && chosen().length) ({cards, gaps, trans})[h]();
  else startScreen();
})();

})();
</script>
